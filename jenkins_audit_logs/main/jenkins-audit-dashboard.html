<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Audit Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .jenkins-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #c41c3b 0%, #a01830 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(196, 28, 59, 0.3);
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 5px solid var(--primary);
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
        }

        .filters-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
        }

        .filter-title {
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .logs-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .logs-title {
            font-weight: 700;
            font-size: 16px;
            color: #0f172a;
            margin-bottom: 15px;
        }

        .log-entry {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            color: #334155;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            line-height: 1.5;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-count {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            padding: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Jenkins Audit Dashboard</h1>
            <div class="subtitle">Real-time Monitoring & Compliance System</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="totalLogs">-</div>
                <div class="stat-label">Total Entries</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--warning);">
                <div class="stat-icon">⚙️</div>
                <div class="stat-value" id="configCount">-</div>
                <div class="stat-label">Config Changes</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--success);">
                <div class="stat-icon">➕</div>
                <div class="stat-value" id="createCount">-</div>
                <div class="stat-label">Jobs Created</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--danger);">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="roleCount">-</div>
                <div class="stat-label">Role Changes</div>
            </div>
        </div>

        <div class="filters-box">
            <div class="filter-title">🔍 Filter Audit Logs</div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterLogs('all', this)">📋 All Logs</button>
                <button class="filter-btn" onclick="filterLogs('config', this)">⚙️ Config Changes</button>
                <button class="filter-btn" onclick="filterLogs('create', this)">➕ Jobs Created</button>
                <button class="filter-btn" onclick="filterLogs('role', this)">👥 Role Changes</button>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="font-weight: 600; color: #0f172a;">📅 Date Range:</label>
                    <input type="date" id="startDate"
                        style="padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px;">
                    <span>to</span>
                    <input type="date" id="endDate"
                        style="padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px;">
                    <button onclick="applyDateFilter()"
                        style="padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">Filter</button>
                    <button onclick="clearDateFilter()"
                        style="padding: 8px 16px; background: #e2e8f0; color: #64748b; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">Clear</button>
                </div>

                <div style="display: flex; gap: 10px; margin-left: auto;">
                    <button onclick="downloadCSV()"
                        style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">📥
                        Download CSV</button>
                    <button onclick="downloadJSON()"
                        style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">📥
                        Download JSON</button>
                </div>
            </div>
        </div>

        <div class="logs-box">
            <div class="logs-title">📝 Audit Log Entries</div>
            <div id="logsContainer">
                <div class="log-count">Loading logs...</div>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let currentFilter = 'all';
        let dateFilteredLogs = [];

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                document.getElementById('totalLogs').textContent = data.total_logs || '0';
                document.getElementById('configCount').textContent = data.actions?.configSubmit || '0';
                document.getElementById('createCount').textContent = data.actions?.createItem || '0';
                document.getElementById('roleCount').textContent = data.actions?.role || '0';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                let logs = Array.isArray(data) ? data : (data.logs || []);
                const months = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
                logs.sort((a, b) => {
                    const pa = a.match(/(\w+)\s+(\d+),\s+(\d+)\s+(\d+):(\d+):(\d+),(\d+)\s+(AM|PM)/);
                    const pb = b.match(/(\w+)\s+(\d+),\s+(\d+)\s+(\d+):(\d+):(\d+),(\d+)\s+(AM|PM)/);
                    if (!pa || !pb) return 0;
                    const toMs = (p) => {
                        let h = parseInt(p[4]);
                        if (p[8] === 'PM' && h !== 12) h += 12;
                        if (p[8] === 'AM' && h === 12) h = 0;
                        return new Date(parseInt(p[3]), months[p[1]], parseInt(p[2]), h, parseInt(p[5]), parseInt(p[6])).getTime();
                    };
                    return toMs(pa) - toMs(pb);
                });
                allLogs = logs;
                dateFilteredLogs = [...allLogs];
                displayLogs();
            } catch (error) {
                console.error('Error loading logs:', error);
                document.getElementById('logsContainer').innerHTML = '<div class="log-count">Error loading logs</div>';
            }
        }

        function filterLogs(type, button) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            displayLogs();
        }

        function applyDateFilter() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Please select both dates');
                return;
            }

            const start = new Date(startDate);
            const end = new Date(endDate);

            dateFilteredLogs = allLogs.filter(log => {
                const match = log.match(/Mar (\d+), (\d+) (\d+):(\d+):(\d+)/);
                if (!match) return false;
                const logDate = new Date(2026, 2, parseInt(match[1]));
                return logDate >= start && logDate <= end;
            });

            displayLogs();
            alert(`Filtered to ${dateFilteredLogs.length} entries`);
        }

        function clearDateFilter() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            dateFilteredLogs = [...allLogs];
            displayLogs();
        }

        function downloadCSV() {
            let filtered = dateFilteredLogs;

            if (currentFilter === 'config') {
                filtered = filtered.filter(log => log.toLowerCase().includes('configsubmit'));
            } else if (currentFilter === 'create') {
                filtered = filtered.filter(log => log.toLowerCase().includes('createitem'));
            } else if (currentFilter === 'role') {
                filtered = filtered.filter(log => {
                    const lower = log.toLowerCase();
                    return lower.includes('manage/role') || lower.includes('rolessubmit') || lower.includes('assign-roles');
                });
            }

            let csv = 'Timestamp,Action,Details\n';
            filtered.forEach(log => {
                const timestamp = log.split(' ')[0] + ' ' + log.split(' ')[1] + ' ' + log.split(' ')[2];
                const details = log.replace(/"/g, '""');
                csv += `"${timestamp}","${details}",""\n`;
            });

            downloadFile(csv, `jenkins-audit-${new Date().toISOString().split('T')[0]}.csv`, 'text/csv');
        }

        function downloadJSON() {
            let filtered = dateFilteredLogs;

            if (currentFilter === 'config') {
                filtered = filtered.filter(log => log.toLowerCase().includes('configsubmit'));
            } else if (currentFilter === 'create') {
                filtered = filtered.filter(log => log.toLowerCase().includes('createitem'));
            } else if (currentFilter === 'role') {
                filtered = filtered.filter(log => {
                    const lower = log.toLowerCase();
                    return lower.includes('manage/role') || lower.includes('rolessubmit') || lower.includes('assign-roles');
                });
            }

            const data = {
                exportDate: new Date().toISOString(),
                filterType: currentFilter,
                totalEntries: filtered.length,
                logs: filtered
            };

            downloadFile(JSON.stringify(data, null, 2), `jenkins-audit-${new Date().toISOString().split('T')[0]}.json`, 'application/json');
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function displayLogs() {
            let filtered = dateFilteredLogs;

            if (currentFilter === 'config') {
                filtered = filtered.filter(log => log.toLowerCase().includes('configsubmit'));
            } else if (currentFilter === 'create') {
                filtered = filtered.filter(log => log.toLowerCase().includes('createitem'));
            } else if (currentFilter === 'role') {
                filtered = filtered.filter(log => {
                    const lower = log.toLowerCase();
                    return lower.includes('manage/role') || lower.includes('rolessubmit') || lower.includes('assign-roles') || lower.includes('role-strategy');
                });
            }

            const container = document.getElementById('logsContainer');

            if (currentFilter === 'role') {
                renderRoleChanges(filtered, container);
                return;
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="log-count">No ${currentFilter === 'all' ? '' : currentFilter + ' '} logs found</div>`;
                return;
            }

            currentFiltered = filtered;
            currentPage = 1;
            renderPage();
        }

        let currentFiltered = [];
        let currentPage = 1;
        const PAGE_SIZE = 100;

        function renderPage() {
            const container = document.getElementById('logsContainer');
            const total = currentFiltered.length;
            const totalPages = Math.ceil(total / PAGE_SIZE);
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, total);
            const pageData = currentFiltered.slice(start, end);

            let html = pageData.map(log =>
                `<div class="log-entry">${escapeHtml(log)}</div>`
            ).join('');

            // Count info
            html += `<div class="log-count">Showing ${start + 1}–${end} of ${total} entries</div>`;

            // Pagination buttons
            if (totalPages > 1) {
                html += `<div class="pagination">`;
                html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Prev</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += `<span class="page-dots">...</span>`;
                    }
                }
                html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next ›</button>`;
                html += `</div>`;
            }

            container.innerHTML = html;
            container.scrollTop = 0;
        }

        function goPage(page) {
            const totalPages = Math.ceil(currentFiltered.length / PAGE_SIZE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPage();
        }


        async function renderRoleChanges(auditLogs, container) {
            container.innerHTML = '<div class="log-count">Loading...</div>';
            let diffData = [];
            try {
                const res = await fetch('/api/role-diff');
                const data = await res.json();
                diffData = data.changes || [];
            } catch (e) { }

            function permLabel(raw) {
                return raw.replace(/<[^>]+>/g, '').trim()
                    .replace('com.cloudbees.plugins.credentials.CredentialsProvider.', 'Credentials.')
                    .replace('hudson.model.', '')
                    .replace('jenkins.metrics.api.Metrics.', 'Metrics.')
                    .replace('hudson.scm.SCM.', 'SCM.');
            }

            const activeBtn = 'cursor:pointer;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:#667eea;color:white;margin-right:8px';
            const inactiveBtn = 'cursor:pointer;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:rgba(255,255,255,0.08);color:#aaa;margin-right:8px';

            let auditHtml = auditLogs.map(log =>
                `<div class="log-entry" style="font-size:12.5px">${escapeHtml(log)}</div>`
            ).join('');

            let diffHtml = '';
            if (diffData.length === 0) {
                diffHtml = '<div class="log-entry">No config history diffs found.</div>';
            } else {
                diffData.forEach(change => {
                    const hasAdded = change.added.length > 0;
                    const hasRemoved = change.removed.length > 0;
                    diffHtml += `<div style="background:rgba(30,30,60,0.8);border-radius:10px;padding:16px;margin-bottom:14px;border:1px solid rgba(102,126,234,0.25)">`;
                    diffHtml += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08)">
                        <span style="font-size:20px">&#128100;</span>
                        <div style="flex:1">
                            <div style="font-weight:700;font-size:14px;color:#ffffff">${escapeHtml(change.user)}</div>
                            <div style="font-size:11px;color:#c4b5fd;margin-top:2px">${change.timestamp}</div>
                        </div>
                        <div style="display:flex;gap:6px">
                            ${hasAdded ? `<span style="background:#14532d;color:#86efac;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600">+${change.added.length} added</span>` : ''}
                            ${hasRemoved ? `<span style="background:#7f1d1d;color:#fca5a5;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600">-${change.removed.length} removed</span>` : ''}
                        </div>
                    </div>`;
                    if (hasAdded) {
                        diffHtml += `<div style="margin-bottom:8px"><div style="font-size:11px;color:#4ade80;font-weight:700;margin-bottom:6px;letter-spacing:1px">✅ ADDED</div>`;
                        change.added.forEach(a => {
                            const label = permLabel(a);
                            if (label) diffHtml += `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(34,197,94,0.15);border-radius:6px;margin-bottom:4px;font-size:12px">
                                <span style="color:#22c55e">&#10003;</span>
                                <span style="color:#e2e8f0;font-weight:500">${escapeHtml(label)}</span></div>`;
                        });
                        diffHtml += `</div>`;
                    }
                    if (hasRemoved) {
                        diffHtml += `<div><div style="font-size:11px;color:#f87171;font-weight:700;margin-bottom:6px;letter-spacing:1px">🔴 REMOVED</div>`;
                        change.removed.forEach(r => {
                            const label = permLabel(r);
                            if (label) diffHtml += `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(239,68,68,0.15);border-radius:6px;margin-bottom:4px;font-size:12px">
                                <span style="color:#ef4444">&#10007;</span>
                                <span style="color:#e2e8f0;font-weight:500">${escapeHtml(label)}</span></div>`;
                        });
                        diffHtml += `</div>`;
                    }
                    diffHtml += `</div>`;
                });
            }

            container.innerHTML = `
                <div style="margin-bottom:16px">
                    <button id="btn-audit" style="${activeBtn}" onclick="switchRoleTab('audit')">
                        Audit Logs (${auditLogs.length})
                    </button>
                    <button id="btn-diff" style="${inactiveBtn}" onclick="switchRoleTab('diff')">
                        What Changed (${diffData.length})
                    </button>
                </div>
                <div id="role-audit-panel">${auditHtml}</div>
                <div id="role-diff-panel" style="display:none">${diffHtml}</div>`;
        }

        function switchRoleTab(tab) {
            document.getElementById('role-audit-panel').style.display = tab === 'audit' ? 'block' : 'none';
            document.getElementById('role-diff-panel').style.display = tab === 'diff' ? 'block' : 'none';
            const active = 'cursor:pointer;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:#667eea;color:white;margin-right:8px';
            const inactive = 'cursor:pointer;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:rgba(255,255,255,0.08);color:#aaa;margin-right:8px';
            document.getElementById('btn-audit').style.cssText = tab === 'audit' ? active : inactive;
            document.getElementById('btn-diff').style.cssText = tab === 'diff' ? active : inactive;
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadLogs();
            setInterval(() => { loadStats(); loadLogs(); }, 30000);
        });
    </script>
</body>

</html>
